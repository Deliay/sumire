name: Deploy to GitHub Pages

on:
  push:
    branches: [release, 'release/**']
    paths:
      - 'apps/bookstore/**'
      - 'contract/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & unit tests
        working-directory: apps/bookstore
        run: pnpm lint && pnpm test

      - uses: actions/configure-pages@v5

      - name: Build static site
        working-directory: apps/bookstore
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.sumire.live
          NEXT_PUBLIC_RECORDINGS_BASE_URL: https://recordings.vtuber.fffdan.com
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/bookstore/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
