quote: 弹幕有点不乖啊
debutStory: |
  很久很久以前，存在一个遥远的国度。有位女孩诞生在这片古老的家族里。家庭氛围宁静祥和，一片安稳。谁都觉得平静的生活会这么一直持续下去。
  忽然，在极其寻常的一天，浩荡的魔气突然涌现，它席卷而来，顷刻吞噬了一切。等她醒来，家族只剩下一间破败的书屋。与此同时，她还发现自己身上缠满了紫色的神秘的藤蔓。
  在这之后，她不仅要维持家族仅剩书店的运转，还要和这一条危险的藤蔓和谐共生。当然，有些时候，藤蔓会失控。
debutIntro: |
  在陌生城市的小巷深处，有一家陈旧的小书店，店主是个叫枝堇的少女。
  当你走进书店待上一会儿，不久就会觉得这地方有点不太对劲。店里装饰的藤蔓植物好像有自己的想法，会慢慢朝人那边伸展过来。你要是站在同一个位置看书太久，藤蔓甚至会悄悄缠上你的脚踝。
  她为了守住家里世代留下的书店，一边看店，一边还打着两份工，把妹妹拉扯大——那……偶尔被她缠一下，也没什么大不了的啦。
