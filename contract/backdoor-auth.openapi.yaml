openapi: 3.1.0
info:
  title: sumire backdoor auth
  description: 枝堇Sumire 后台系统 V1 鉴权与用户管理 API 契约。单一事实源，实现与 tests/api 集成测试均以本文档为准。
  version: 1.3.0
servers:
  - url: https://api.sumire.live
paths:
  /api/auth/login:
    post:
      summary: 登录
      description: 校验账号密码，成功则下发会话 Cookie。失败不区分账号错误与密码错误。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 登录成功，Set-Cookie 写入会话
          headers:
            Set-Cookie:
              schema: { type: string }
              description: sumire_sid=<id>; HttpOnly; Path=/; SameSite=Lax; Max-Age=604800（生产含 Secure）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeOk" }
        "400":
          description: 缺少 username 或 password 字段
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/InvalidCredentials" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/auth/logout:
    post:
      summary: 登出（幂等，删除当前会话）
      description: 无会话/会话已失效时同样返回 200 并清除 Cookie。
      responses:
        "200":
          description: 会话已删除，Set-Cookie 立即过期
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
  /api/auth/me:
    get:
      summary: 当前会话与角色信息
      description: 返回当前登录会话的用户名、角色与强制改密标记。
      responses:
        "200":
          description: 已登录
          content: { application/json: { schema: { $ref: "#/components/schemas/MeOk" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/change-password:
    post:
      summary: 修改自己的密码
      description: 改密成功后 mustChangePassword=false，当前会话保持有效。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword:
                  type: string
                  description: ≥16 位，含字母、数字、符号，且不同于原密码
      responses:
        "200":
          description: 修改成功
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/WrongOldPassword" }
  /api/users:
    get:
      summary: 用户列表（仅 superadmin）
      description: 返回全部账号（用户名、角色、创建时间）。
      responses:
        "200":
          description: 用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: 创建用户
      description: 超管可创建任意角色；admin 仅可创建 member；member 无创建能力。新用户 mustChangePassword=true。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string, description: "初始密码，≥16 位，含字母、数字、符号" }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: 创建成功（新用户 mustChangePassword=true）
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  username: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  schemas:
    Role:
      type: string
      enum: [superadmin, admin, member]
    Ok:
      type: object
      properties:
        ok: { type: boolean, const: true }
    MeOk:
      type: object
      required: [ok, username, role, mustChangePassword]
      properties:
        ok: { type: boolean, const: true }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        mustChangePassword: { type: boolean }
    User:
      type: object
      required: [username, role, createdAt]
      properties:
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
  responses:
    InvalidCredentials:
      description: 账号或密码错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: 未登录或会话已失效
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    WrongOldPassword:
      description: 原密码错误
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    BadRequest:
      description: 参数不合法（含密码强度不达标、新密码与原密码相同、角色非法）
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: 已登录但角色权限不足
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: 用户名已存在
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: 尝试过于频繁
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
